name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: afet360_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: afet360_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_ci_password
      DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/afet360_test
      AI_PROVIDER: ollama

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff linter
        working-directory: backend
        run: ruff check .

      - name: Run Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Apply database migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current

      - name: Run backend pytest suite
        working-directory: backend
        run: pytest -q --durations=15

      - name: Smoke check OpenAPI schema generation
        working-directory: backend
        run: python -c "from app.main import app; print('OpenAPI paths count:', len(app.openapi()['paths']))"

  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend linter
        working-directory: frontend
        run: npm run lint

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Production Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          POSTGRES_PASSWORD=ci_dummy_password VITE_GOOGLE_MAPS_API_KEY=CI_ONLY_NONFUNCTIONAL_MAPS_KEY docker compose -f docker-compose.prod.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production backend image
        run: docker build -t afet360-backend:ci -f backend/Dockerfile backend

      - name: Build production web image
        run: docker build -t afet360-web:ci --build-arg VITE_GOOGLE_MAPS_API_KEY=CI_ONLY_NONFUNCTIONAL_MAPS_KEY -f frontend/Dockerfile frontend

  ci-gate:
    name: Release Quality Gate
    needs: [backend, frontend, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Quality gate passed
        run: echo "All release quality gates (backend, frontend, docker-build) passed successfully."
