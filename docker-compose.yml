services:
  db:
    image: postgis/postgis:16-3.4
    container_name: afet360_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afet360}
      POSTGRES_USER: ${POSTGRES_USER:-afet360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afet360_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afet360} -d ${POSTGRES_DB:-afet360}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: afet360_postgres_data
